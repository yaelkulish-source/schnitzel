<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Installable home-screen app (no service worker: always loads the latest files) -->
  <link rel="manifest" href="manifest-shopping.json">
  <meta name="theme-color" content="#6d28d9">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/shopping-192.png">
  <link rel="apple-touch-icon" href="icons/shopping-apple-touch.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="קניות">
  <title>קניות — דוכן שניצלים</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #6d28d9; --brand-dark: #4c1d95; --bg: #f5f3ff; --card: #fff;
      --line: #e5e7eb; --muted: #6b7280; --ok: #059669; --ok-bg: #d1fae5; --warn: #b45309; --warn-bg: #fef3c7;
    }
    html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
    body {
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      direction: rtl; background: var(--bg); color: #111; min-height: 100vh;
      font-size: 17px; line-height: 1.35;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    /* ─── header + tabs ──────────────────────────────────────────────────── */
    #top { position: sticky; top: 0; z-index: 50; background: var(--brand); color: #fff;
           padding-top: env(safe-area-inset-top); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    #header { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px; }
    .title { font-size: 1.3rem; font-weight: 900; }
    #conn-wrap { margin-right: auto; display: flex; align-items: center; gap: 6px; font-size: .85rem; opacity: .9; }
    #conn-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    #conn-dot.connected { background: #4ade80; }
    #tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
    .tab { min-height: 52px; border: none; background: none; color: #ddd6fe; font-weight: 800; font-size: 1rem;
           border-bottom: 4px solid transparent; padding: 4px 2px; }
    .tab.active { color: #fff; border-bottom-color: #fff; }

    main { max-width: 640px; margin: 0 auto; padding: 14px 16px 120px; }
    .panel { display: none; flex-direction: column; gap: 14px; }
    .panel.active { display: flex; }

    .card { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .muted { color: var(--muted); }
    .small { font-size: .9rem; }
    .big-btn { min-height: 56px; border: none; border-radius: 14px; background: var(--brand); color: #fff;
               font-size: 1.15rem; font-weight: 800; padding: 0 18px; width: 100%; }
    .big-btn:active { opacity: .85; }
    .big-btn.secondary { background: #fff; color: var(--brand-dark); border: 2px solid #c4b5fd; }
    .big-btn.danger { background: #fff; color: #b91c1c; border: 2px solid #fca5a5; }
    .big-btn:disabled { opacity: .45; }
    .badge { display: inline-block; font-size: .8rem; font-weight: 800; border-radius: 20px; padding: 2px 9px; vertical-align: middle; }
    .badge.check  { background: var(--warn-bg); color: var(--warn); }
    .badge.bakery { background: #fde68a; color: #78350f; }

    /* ─── portions ───────────────────────────────────────────────────────── */
    .portion { display: flex; align-items: center; gap: 10px; }
    .portion-name { flex: 1; font-size: 1.15rem; font-weight: 800; }
    .portion-name .muted { display: block; font-size: .9rem; font-weight: 600; }
    .stepper { display: flex; align-items: center; gap: 6px; }
    .step { width: 56px; height: 56px; border-radius: 14px; border: 2px solid #c4b5fd; background: #ede9fe;
            font-size: 1.8rem; font-weight: 900; color: var(--brand-dark); line-height: 1; }
    .step:active { background: #ddd6fe; }
    .portion input { width: 70px; height: 56px; border: 2px solid var(--line); border-radius: 12px; text-align: center;
                     font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stat b { display: block; font-size: 1.5rem; font-weight: 900; color: var(--brand-dark); font-variant-numeric: tabular-nums; }
    .stat span { font-size: .85rem; color: var(--muted); font-weight: 700; }
    #avg-info { font-size: .95rem; }

    /* ─── shopping list ──────────────────────────────────────────────────── */
    .progress { height: 14px; background: #ede9fe; border-radius: 10px; overflow: hidden; margin: 8px 0 4px; }
    .progress > div { height: 100%; background: var(--ok); transition: width .2s; }
    .sum-line { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; margin-top: 6px; }
    .sum-line b { font-variant-numeric: tabular-nums; }
    .dept-title { font-size: 1.05rem; font-weight: 900; color: var(--brand-dark); margin: 6px 4px 6px; display: flex; gap: 8px; align-items: center; }
    .dept { display: flex; flex-direction: column; gap: 8px; }
    .row { background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.07);
           display: flex; flex-direction: column; gap: 10px; border: 2px solid transparent; }
    .row.cart { background: var(--ok-bg); border-color: #6ee7b7; }
    .row.home { opacity: .55; background: #f3f4f6; }
    .row-name { font-size: 1.15rem; font-weight: 800; }
    .row.cart .row-name { text-decoration: line-through; text-decoration-thickness: 2px; }
    .row-qty { font-size: 1.25rem; font-weight: 900; color: var(--brand-dark); }
    .row-sub { font-size: .9rem; color: var(--muted); font-weight: 600; }
    .row-btns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
    .tog { min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-weight: 800; font-size: 1.05rem; }
    .tog.on.cart-btn { background: var(--ok); border-color: var(--ok); color: #fff; }
    .tog.on.home-btn { background: #4b5563; border-color: #4b5563; color: #fff; }

    /* ─── recipe editor ──────────────────────────────────────────────────── */
    .ritem { display: flex; flex-direction: column; gap: 10px; }
    .ritem-head { display: flex; gap: 8px; align-items: center; }
    .ritem-head input { flex: 1; font-weight: 800; font-size: 1.1rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid.four { grid-template-columns: repeat(2, 1fr); }
    label.f { display: flex; flex-direction: column; gap: 3px; font-size: .82rem; font-weight: 700; color: var(--muted); }
    .f input, .f textarea, .ritem-head input, .add-form input {
      min-height: 46px; border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; background: #fff; width: 100%;
    }
    .f textarea { min-height: 46px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: #a78bfa; }
    fieldset { border: 2px dashed #ddd6fe; border-radius: 12px; padding: 8px 10px 10px; }
    legend { font-size: .85rem; font-weight: 800; color: var(--brand-dark); padding: 0 6px; }
    .chk { display: flex; align-items: center; gap: 8px; font-weight: 800; min-height: 46px; }
    .chk input { width: 26px; height: 26px; accent-color: var(--warn); }
    .icon-btn { min-width: 48px; min-height: 48px; border-radius: 12px; border: 2px solid #fca5a5; background: #fff; color: #b91c1c; font-size: 1.2rem; font-weight: 900; }
    #save-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: #fff; border-top: 2px solid #ddd6fe;
                padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: none; }
    #save-bar.show { display: block; }
    #save-bar .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
    #recipe-notice { display: none; background: var(--warn-bg); color: var(--warn); font-weight: 700; }

    /* ─── checklist ──────────────────────────────────────────────────────── */
    .cl-row { display: flex; gap: 8px; align-items: stretch; }
    .cl-tick { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 54px; text-align: right;
               background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 1.08rem; font-weight: 700; }
    .cl-box { width: 30px; height: 30px; border-radius: 8px; border: 2.5px solid #a78bfa; flex-shrink: 0;
              display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; }
    .cl-tick.done { background: var(--ok-bg); border-color: #6ee7b7; color: var(--muted); }
    .cl-tick.done .cl-box { background: var(--ok); border-color: var(--ok); }
    .cl-tick.done .cl-text { text-decoration: line-through; }
    .cl-del { min-width: 48px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: #9ca3af; font-size: 1.2rem; font-weight: 900; }
    .add-form { display: flex; flex-direction: column; gap: 8px; }

    /* ─── confirm dialog ─────────────────────────────────────────────────── */
    #confirm { position: fixed; inset: 0; z-index: 300; background: rgba(17,24,39,.55); display: none;
               align-items: flex-end; justify-content: center; padding: 16px; }
    #confirm.show { display: flex; }
    #confirm .box { background: #fff; border-radius: 18px; padding: 18px; width: 100%; max-width: 480px;
                    display: flex; flex-direction: column; gap: 12px; margin-bottom: env(safe-area-inset-bottom); }
    #confirm-text { font-size: 1.15rem; font-weight: 800; }
    #confirm .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .empty { text-align: center; color: var(--muted); font-weight: 700; padding: 24px 0; }
  </style>
</head>
<body>

<div id="top">
  <div id="header">
    <span class="title">🛒 קניות</span>
    <div id="conn-wrap"><span id="conn-dot"></span><span id="conn-text">מתחבר…</span></div>
  </div>
  <nav id="tabs">
    <button class="tab" data-tab="portions">מנות</button>
    <button class="tab" data-tab="list">רשימה</button>
    <button class="tab" data-tab="recipe">מתכון</button>
    <button class="tab" data-tab="checklist">לפני מכירה</button>
  </nav>
</div>

<main>
  <!-- 1) portions -->
  <section class="panel" id="panel-portions">
    <div class="card" id="portion-list"></div>
    <button class="big-btn" id="avg-btn">📊 מלא לפי ממוצע</button>
    <div id="avg-info" class="muted"></div>
    <div class="card stats" id="portion-stats"></div>
  </section>

  <!-- 2) shopping list -->
  <section class="panel" id="panel-list">
    <div class="card" id="list-summary"></div>
    <div id="list-body"></div>
    <button class="big-btn danger" id="clear-marks-btn">ניקוי סימונים</button>
  </section>

  <!-- 3) recipe -->
  <section class="panel" id="panel-recipe">
    <div class="card" id="recipe-notice"></div>
    <div id="recipe-body"></div>
    <button class="big-btn secondary" id="add-item-btn">＋ הוסף פריט</button>
    <datalist id="dept-list"></datalist>
  </section>

  <!-- 4) pre-sale checklist -->
  <section class="panel" id="panel-checklist">
    <div class="card" id="cl-summary"></div>
    <div id="cl-body"></div>
    <div class="card add-form">
      <b>הוספת פריט</b>
      <input id="cl-group" list="cl-groups" placeholder="קבוצה (למשל: הכנות)" autocomplete="off">
      <datalist id="cl-groups"></datalist>
      <input id="cl-text" placeholder="מה צריך לעשות / להביא" autocomplete="off">
      <button class="big-btn secondary" id="cl-add-btn">＋ הוסף</button>
    </div>
    <button class="big-btn danger" id="cl-reset-btn">🔄 מכירה חדשה</button>
  </section>
</main>

<div id="save-bar"><div class="inner">
  <button class="big-btn" id="save-btn">💾 שמור מתכון</button>
  <button class="big-btn secondary" id="discard-btn">בטל</button>
</div></div>

<div id="confirm" role="dialog" aria-modal="true">
  <div class="box">
    <div id="confirm-text"></div>
    <div class="btns">
      <button class="big-btn danger" id="confirm-ok">אישור</button>
      <button class="big-btn secondary" id="confirm-cancel">ביטול</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/shopping.js"></script>
</body>
</html>
